<!--Dice Generator Landing Page for Devs Inc-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devs Inc - Dice Generator</title>
    <script src="https://kit.fontawesome.com/d2fbab573a.js" crossorigin="anonymous"></script>
    <link rel="icon" type="image/svg+xml" href="dice-d20-solid-full.svg">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Dice Generator</h1>
    <div class="diceborder">
        <h2>D6</h2>
        <i class="fa-solid fa-dice" style="color: #FFDAB9;" font-size="90px"></i>
        <p class="resLabel">Result: <span id="result6"></span></p>
        <button class="button1" id="rollButton6">Let's Roll!</button>
    </div>

    <div class="diceborder">
        <h2>D10</h2>
        <i class="fa-solid fa-dice" style="color: #FFDAB9;" font-size="90px"></i>
        <p class="resLabel">Result: <span id="result10"></span></p>
        <button class="button1" id="rollButton10">Let's Roll!</button>
    </div>

    <div class="diceborder">
        <h2>D20</h2>
        <i class="fa-solid fa-dice" style="color: #FFDAB9;" font-size="90px"></i>
        <p class="resLabel">Result: <span id="result20"></span></p>
        <button class="button1" id="rollButton20">Let's Roll!</button>
    </div>
    <script src="script.js"></script>
</body>

</html>
