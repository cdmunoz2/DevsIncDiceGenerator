<!--Dice Generator Landing Page for Devs Inc-->
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Devs Inc - Dice Generator</title>
    <script src="https://kit.fontawesome.com/d2fbab573a.js" crossorigin="anonymous"></script>
    <link rel="icon" type="image/svg+xml" href="dice-d20-solid-full.svg">
    <link rel="stylesheet" href="styles.css">
</head>

<body>
    <h1>Dice Generator</h1>
    <div class="diceborder">
        <h2>D6 - 6 Numbers</h2>

        <button class="button2">Reset</button>
    </div>

    <div class="diceborder">
        <h2>D10 - 10 Numbers</h2>

    </div>

    <div class="diceborder">
        <h2>D20 - 20 Numbers</h2>
        <i class="fa-solid fa-dice" style="color: #FFDAB9;" font-size="150px"></i>

        <button class="button2">Reset</button>
    </div>
</body>

</html>
